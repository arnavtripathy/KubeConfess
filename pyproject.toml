[project]
name = "kubeconfess"
version = "0.0.1"
description = "Make your cluster confess its vulnerabilities rather than running multiple tools. A conversational AI agent for Kubernetes — inspect and audit your cluster in plain English."
authors = [
    {name = "Arnav Tripathy"}
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["kubernetes", "CLI", "AI"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "openai>=2.38.0",
    "kubernetes>=36.0.1",
    "rich>=15.0.0",
]


[project.scripts]
kubeconfess = "kubeconfess.main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kubeconfess"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
ignore = ["RUF013", "PERF203", "E501", "S110", "C401", "PLW1508"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
implicit_optional = true
exclude = ["^\\.venv/"]


[tool.coverage.report]
show_missing = true

[dependency-groups]
tests = [
    "pytest>=9.0.2,<10.0.0",
]
dev = [
    "ruff (>=0.16.0,<0.17.0)",
    "mypy (>=2.3.0,<2.4.0)",
]